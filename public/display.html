<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111213">
<title>Queue display</title>
<link rel="stylesheet" href="/style.css">
<style>
  :root {
    --bg: #111213;
    --surface: #1c1d1f;
    --fg: #f4f4f5;
    --muted: #9b9ca0;
    --line: #2a2b2e;
    --warn: #d4a72c;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); cursor: default; user-select: none; -webkit-user-select: none; }

  .screen { display: flex; flex-direction: column; height: 100%; }

  .stage { flex: 1 1 auto; min-height: 0; display: flex; padding: 3vh 2.5vw 2vh; }
  .grid { flex: 1 1 auto; min-height: 0; display: grid; gap: var(--gap, 16px); align-content: start; }
  .card {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4% 6%;
    background: var(--surface);
    border-radius: 12px;
    text-align: center;
    overflow: hidden;
  }
  .card .num {
    font-size: var(--num, 80px);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .card .name {
    max-width: 100%;
    margin-top: .35em;
    font-size: var(--name, 20px);
    line-height: 1.2;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card.latest { background: #2a2c2f; box-shadow: inset 0 0 0 2px var(--fg); }
  .card.latest .name { color: var(--fg); }
  .card.flash { animation: flash .6s ease-out; }
  @keyframes flash { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .empty {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5vh;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
  }

  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vh 2.5vw 2.6vh;
    border-top: 1px solid var(--line);
  }
  .waiting { display: flex; align-items: baseline; gap: 1.6vw; }
  .waiting .label { font-size: 3vh; font-weight: 500; color: var(--muted); }
  .waiting .count { font-size: 7vh; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock { font-size: 5vh; line-height: 1; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }


  .conn {
    position: fixed; top: 1.2vh; right: 1.2vw;
    display: flex; align-items: center; gap: .6em;
    font-size: 1.5vh; color: var(--muted);
  }
  .conn::before { content: ""; width: 1vh; height: 1vh; border-radius: 50%; background: var(--warn); }

  .login { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login form { width: 100%; max-width: 320px; }
  .login h1 { font-size: 22px; margin-bottom: 6px; }
  .login p.muted { margin: 0 0 22px; font-size: 15px; }
  .login .error:empty { visibility: hidden; }
  .login, .login * { user-select: auto; -webkit-user-select: auto; }
  .login .btn-primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  @media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form id="login-form">
    <h1>Waiting room display</h1>
    <p class="muted">Enter the admin password.</p>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit" id="login-btn">Show queue</button>
  </form>
</div>

<div id="screen" class="screen hidden">
  <main class="stage">
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="empty hidden" id="empty">Please wait &mdash; we&rsquo;ll call you soon</div>
  </main>
  <footer class="bar">
    <div class="waiting">
      <span class="label">Waiting</span>
      <span class="count" id="waiting">0</span>
    </div>
    <div class="clock" id="clock" aria-label="Time"></div>
  </footer>
</div>

<div id="conn" class="conn hidden" role="status">reconnecting&hellip;</div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  var loginView = $('login');
  var screen = $('screen');
  var grid = $('grid');
  var empty = $('empty');
  var conn = $('conn');

  var es = null;
  var known = null;          // numbers in serving after the last event (null = no event yet)
  var reconnectTimer = null;

  // ---- clock ---------------------------------------------------------------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 5000);

  // ---- fullscreen ----------------------------------------------------------
  document.addEventListener('dblclick', function () {
    var d = document, el = d.documentElement;
    var fsEl = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (fsEl) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) {}
  });

  // ---- render --------------------------------------------------------------
  var GAP = 16;
  var CARD_RATIO = 1.5; // preferred card width / height
  var lastCount = 0;
  var slots = 20; // screen limit from admin: the grid always reserves this many places

  // Pick the column count that gives the biggest cards for n items in the available area.
  function layout() {
    var n = Math.max(lastCount, slots);
    if (!lastCount) return;
    var W = grid.clientWidth, H = grid.clientHeight;
    var best = null;
    for (var cols = 1; cols <= n; cols++) {
      var rows = Math.ceil(n / cols);
      var w = (W - GAP * (cols - 1)) / cols;
      var h = (H - GAP * (rows - 1)) / rows;
      var cardH = Math.min(h, w / CARD_RATIO);
      if (!best || cardH > best.cardH + 0.5) best = { cols: cols, rows: rows, w: w, cardH: cardH };
    }
    var cellH = (H - GAP * (best.rows - 1)) / best.rows;
    grid.style.gridTemplateColumns = 'repeat(' + best.cols + ', minmax(0, 1fr))';
    grid.style.gridAutoRows = Math.floor(cellH) + 'px';
    var num = Math.min(cellH * 0.48, best.w * 0.3);
    grid.style.setProperty('--num', Math.max(18, Math.floor(num)) + 'px');
    grid.style.setProperty('--name', Math.max(12, Math.floor(num * 0.26)) + 'px');
    grid.style.setProperty('--gap', GAP + 'px');
  }
  window.addEventListener('resize', layout);

  function render(data) {
    var serving = ((data && data.serving) || []).slice();
    var latestAt = 0; // everyone called in the most recent batch gets highlighted
    serving.forEach(function (p) { if ((p.called_at || 0) > latestAt) latestAt = p.called_at || 0; });
    var batch = serving.filter(function (p) { return (p.called_at || 0) === latestAt; }).length;
    serving.sort(function (a, b) { return a.number - b.number; });

    var fresh = {};
    var isFirst = known === null;
    var next = {};
    serving.forEach(function (p) {
      next[p.number] = true;
      if (!isFirst && !known[p.number]) fresh[p.number] = true;
    });
    known = next;

    grid.textContent = '';
    serving.forEach(function (p) {
      var card = document.createElement('div');
      card.className = 'card' + (p.called_at === latestAt && batch < serving.length && batch <= 5 ? ' latest' : '') + (fresh[p.number] ? ' flash' : '');
      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = String(p.number);
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.name || '';
      card.appendChild(num);
      card.appendChild(name);
      grid.appendChild(card);
    });
    grid.classList.toggle('hidden', serving.length === 0);
    empty.classList.toggle('hidden', serving.length !== 0);
    lastCount = serving.length;
    if (data && data.maxServing > 0) slots = data.maxServing;
    layout();

    $('waiting').textContent = String((data && data.waiting) || 0);

  }

  // ---- live connection -----------------------------------------------------
  function setConnected(ok) { conn.classList.toggle('hidden', ok); }

  function connect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (es) es.close();
    loginView.classList.add('hidden');
    screen.classList.remove('hidden');

    es = new EventSource('/api/display/events');
    es.addEventListener('display', function (e) {
      setConnected(true);
      var data;
      try { data = JSON.parse(e.data); } catch (err) { return; }
      render(data);
    });
    es.onopen = function () { setConnected(true); };
    es.onerror = function () {
      setConnected(false);
      var source = es;
      getMe().then(function (admin) {
        if (source !== es) return;
        if (!admin) { es.close(); es = null; showLogin(); return; }
        if (es.readyState === 2) retryLater(); // closed for good: reopen ourselves
      }, function () {
        if (source === es && es.readyState === 2) retryLater();
      });
    };
  }

  function retryLater() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () { reconnectTimer = null; connect(); }, 3000);
  }

  function getMe() {
    return fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (b) { return !!(b && b.admin); });
  }

  // ---- login ---------------------------------------------------------------
  function showLogin() {
    setConnected(true);
    screen.classList.add('hidden');
    loginView.classList.remove('hidden');
    $('password').value = '';
    $('password').focus();
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('login-btn');
    var err = $('login-error');
    var pw = $('password').value;
    if (!pw) { err.textContent = 'Please enter the password.'; return; }
    err.textContent = '';
    btn.disabled = true;
    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; });
    }).then(function (r) {
      btn.disabled = false;
      if (r.status === 200) { known = null; connect(); return; }
      err.textContent = r.status === 401 ? 'Wrong password.' :
        (r.body && r.body.error) || 'Could not log in. Please try again.';
    }, function () {
      btn.disabled = false;
      err.textContent = 'Could not reach the server.';
    });
  });

  // ---- start ---------------------------------------------------------------
  function start() {
    getMe().then(function (admin) {
      if (admin) connect(); else showLogin();
    }, function () {
      setConnected(false);
      setTimeout(start, 3000);
    });
  }
  start();
})();
</script>
</body>
</html>
