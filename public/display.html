<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e10">
<title>Now serving</title>
<link rel="stylesheet" href="/style.css">
<style>
  :root {
    --bg: #0b0e10;
    --surface: #14191c;
    --fg: #f2f5f7;
    --muted: #8a949c;
    --line: #232a2f;
    --accent: #2dd4bf;
    --accent-fg: #04201d;
    --danger: #f97066;
    --warn: #f5b84a;
    color-scheme: dark;
  }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); cursor: default; user-select: none; -webkit-user-select: none; }

  .screen { display: flex; flex-direction: column; height: 100%; }

  /* ---- serving area ---- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 4.5vh 4vw 3vh;
  }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; margin-bottom: 3.5vh; }
  .label {
    margin: 0;
    font-size: 3vh;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hint { margin: 0; font-size: 1.7vh; color: var(--muted); opacity: .75; }

  .grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    gap: 2.4vh;
    grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
  }
  .card {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2vh 2vw;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 2.2vh;
    text-align: center;
    overflow: hidden;
  }
  .card .num {
    font-size: var(--num, 20vh);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }
  .card .name {
    max-width: 100%;
    margin-top: calc(var(--name, 4vh) * .45);
    font-size: var(--name, 4vh);
    line-height: 1.2;
    font-weight: 500;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card.latest { border-color: var(--accent); background: #0f2422; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
  .card.latest .num { color: var(--accent); }
  .card.latest .name { color: var(--fg); }
  .card.flash { animation: flash 1.6s ease-out; }
  @keyframes flash {
    0%   { transform: scale(.9); opacity: 0; box-shadow: 0 0 0 0 rgba(45, 212, 191, .55); }
    25%  { transform: scale(1.03); opacity: 1; }
    45%  { transform: scale(1); box-shadow: 0 0 0 2.5vh rgba(45, 212, 191, 0); }
    100% { transform: scale(1); }
  }

  /* sizes by how many are being served (number size is bound by both height and width) */
  .grid.n1  { --cols: 1; --num: 40vh; --num: min(40vh, 30vw);  --name: 6vh; }
  .grid.n1 .card { background: transparent; border-color: transparent; }
  .grid.n2  { --cols: 2; --num: 32vh; --num: min(32vh, 17vw);  --name: 5vh; }
  .grid.n3  { --cols: 3; --num: 26vh; --num: min(26vh, 13vw);  --name: 4.2vh; }
  .grid.n4  { --cols: 2; --num: 18vh; --num: min(18vh, 15vw);  --name: 3.6vh; }
  .grid.n6  { --cols: 3; --num: 16vh; --num: min(16vh, 10vw);  --name: 3.2vh; }
  .grid.n8  { --cols: 4; --num: 15vh; --num: min(15vh, 8vw);   --name: 2.8vh; }
  .grid.n12 { --cols: 4; --num: 11vh; --num: min(11vh, 8vw);  --name: 2.4vh; gap: 1.8vh; }
  .grid.n12 .card { padding: 1vh 1.5vw; border-radius: 1.6vh; }

  .empty {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 5.5vh;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
  }

  /* ---- footer bar ---- */
  .bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2.6vh 4vw 3.2vh;
    border-top: 1px solid var(--line);
  }
  .waiting { display: flex; align-items: baseline; gap: 2vw; }
  .waiting .label { font-size: 3vh; }
  .waiting .count { font-size: 9vh; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .clock { font-size: 6vh; line-height: 1; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---- connection dot ---- */
  .conn {
    position: fixed; top: 1.6vh; right: 1.6vh;
    display: flex; align-items: center; gap: .6em;
    font-size: 1.5vh; color: var(--muted);
  }
  .conn::before {
    content: ""; width: 1.1vh; height: 1.1vh; border-radius: 50%;
    background: var(--warn); animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }

  /* ---- login ---- */
  .login { height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login form { width: 100%; max-width: 320px; }
  .login h1 { font-size: 22px; margin-bottom: 6px; }
  .login p.muted { margin: 0 0 22px; font-size: 15px; }
  .login .error:empty { visibility: hidden; }
  .login, .login * { user-select: auto; -webkit-user-select: auto; }

  @media (prefers-reduced-motion: reduce) {
    .card.flash, .conn::before { animation: none; }
  }
</style>
</head>
<body>

<div id="login" class="login hidden">
  <form id="login-form">
    <h1>Waiting room display</h1>
    <p class="muted">Enter the admin password.</p>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit" id="login-btn">Show queue</button>
  </form>
</div>

<div id="screen" class="screen hidden">
  <main class="stage">
    <div class="top">
      <h1 class="label">Now serving</h1>
      <p class="hint" id="sound-hint">Click anywhere to enable sound</p>
    </div>
    <div class="grid" id="grid" aria-live="polite"></div>
    <div class="empty hidden" id="empty">Please wait &mdash; we&rsquo;ll call you soon</div>
  </main>
  <footer class="bar">
    <div class="waiting">
      <span class="label">Waiting</span>
      <span class="count" id="waiting">0</span>
    </div>
    <div class="clock" id="clock" aria-label="Time"></div>
  </footer>
</div>

<div id="conn" class="conn hidden" role="status">reconnecting&hellip;</div>

<script>
(function () {
  'use strict';

  function $(id) { return document.getElementById(id); }

  var loginView = $('login');
  var screen = $('screen');
  var grid = $('grid');
  var empty = $('empty');
  var conn = $('conn');

  var es = null;
  var known = null;          // numbers in serving after the last event (null = no event yet)
  var audio = null;
  var reconnectTimer = null;

  // ---- clock ---------------------------------------------------------------
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    $('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  tick();
  setInterval(tick, 5000);

  // ---- sound ---------------------------------------------------------------
  document.addEventListener('click', function () {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { $('sound-hint').classList.add('hidden'); return; }
    try {
      if (!audio) audio = new Ctx();
      if (audio.resume) audio.resume();
      $('sound-hint').classList.add('hidden');
    } catch (e) {}
  });

  function tone(freq, start, dur) {
    var t = audio.currentTime + start;
    var osc = audio.createOscillator();
    var gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  function chime() {
    if (!audio || audio.state !== 'running') return;
    try {
      tone(784, 0, 1.1);      // G5
      tone(1568, 0, 0.5);     // soft overtone
      tone(659.25, 0.38, 1.5); // E5
      tone(1318.5, 0.38, 0.6);
    } catch (e) {}
  }

  // ---- fullscreen ----------------------------------------------------------
  document.addEventListener('dblclick', function () {
    var d = document, el = d.documentElement;
    var fsEl = d.fullscreenElement || d.webkitFullscreenElement;
    try {
      if (fsEl) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    } catch (e) {}
  });

  // ---- render --------------------------------------------------------------
  function sizeClass(n) {
    if (n <= 1) return 'n1';
    if (n === 2) return 'n2';
    if (n === 3) return 'n3';
    if (n === 4) return 'n4';
    if (n <= 6) return 'n6';
    if (n <= 8) return 'n8';
    return 'n12';
  }

  function render(data) {
    var serving = (data && data.serving) || [];
    serving = serving.slice().sort(function (a, b) { return (b.called_at || 0) - (a.called_at || 0); });

    var fresh = {};
    var isFirst = known === null;
    var next = {};
    var anyNew = false;
    serving.forEach(function (p) {
      next[p.number] = true;
      if (!isFirst && !known[p.number]) { fresh[p.number] = true; anyNew = true; }
    });
    known = next;

    grid.textContent = '';
    grid.className = 'grid ' + sizeClass(serving.length);
    serving.forEach(function (p, i) {
      var card = document.createElement('div');
      card.className = 'card' + (i === 0 ? ' latest' : '') + (fresh[p.number] ? ' flash' : '');
      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = String(p.number);
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = p.name || '';
      card.appendChild(num);
      card.appendChild(name);
      grid.appendChild(card);
    });
    grid.classList.toggle('hidden', serving.length === 0);
    empty.classList.toggle('hidden', serving.length !== 0);

    $('waiting').textContent = String((data && data.waiting) || 0);

    if (anyNew) chime();
  }

  // ---- live connection -----------------------------------------------------
  function setConnected(ok) { conn.classList.toggle('hidden', ok); }

  function connect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    if (es) es.close();
    loginView.classList.add('hidden');
    screen.classList.remove('hidden');

    es = new EventSource('/api/display/events');
    es.addEventListener('display', function (e) {
      setConnected(true);
      var data;
      try { data = JSON.parse(e.data); } catch (err) { return; }
      render(data);
    });
    es.onopen = function () { setConnected(true); };
    es.onerror = function () {
      setConnected(false);
      var source = es;
      getMe().then(function (admin) {
        if (source !== es) return;
        if (!admin) { es.close(); es = null; showLogin(); return; }
        if (es.readyState === 2) retryLater(); // closed for good: reopen ourselves
      }, function () {
        if (source === es && es.readyState === 2) retryLater();
      });
    };
  }

  function retryLater() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(function () { reconnectTimer = null; connect(); }, 3000);
  }

  function getMe() {
    return fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (b) { return !!(b && b.admin); });
  }

  // ---- login ---------------------------------------------------------------
  function showLogin() {
    setConnected(true);
    screen.classList.add('hidden');
    loginView.classList.remove('hidden');
    $('password').value = '';
    $('password').focus();
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('login-btn');
    var err = $('login-error');
    var pw = $('password').value;
    if (!pw) { err.textContent = 'Please enter the password.'; return; }
    err.textContent = '';
    btn.disabled = true;
    fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; });
    }).then(function (r) {
      btn.disabled = false;
      if (r.status === 200) { known = null; connect(); return; }
      err.textContent = r.status === 401 ? 'Wrong password.' :
        (r.body && r.body.error) || 'Could not log in. Please try again.';
    }, function () {
      btn.disabled = false;
      err.textContent = 'Could not reach the server.';
    });
  });

  // ---- start ---------------------------------------------------------------
  function start() {
    getMe().then(function (admin) {
      if (admin) connect(); else showLogin();
    }, function () {
      setConnected(false);
      setTimeout(start, 3000);
    });
  }
  start();
})();
</script>
</body>
</html>
